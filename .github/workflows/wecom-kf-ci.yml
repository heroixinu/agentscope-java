name: WeCom KF CI

on:
  push:
    branches:
      - feature/wecom-kf-channel
  pull_request:
    paths:
      - '.github/workflows/wecom-kf-ci.yml'
      - 'agentscope-extensions/agentscope-extensions-channel/agentscope-extensions-channel-wecom-kf/**'
      - 'agentscope-extensions/agentscope-extensions-channel/pom.xml'
      - 'agentscope-distribution/agentscope-all/pom.xml'
      - 'agentscope-distribution/agentscope-bom/pom.xml'
      - 'agentscope-service/service-scheduler/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: WeCom KF build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Check distribution module sync
        shell: bash
        run: |
          chmod +x .github/scripts/check-shade-and-bom-sync.sh
          ./.github/scripts/check-shade-and-bom-sync.sh

      - name: Verify WeCom KF and scheduler integration
        shell: bash
        run: >-
          mvn -B -ntp
          -pl agentscope-extensions/agentscope-extensions-channel/agentscope-extensions-channel-wecom-kf,agentscope-service/service-scheduler
          -am
          -DskipITs
          verify
